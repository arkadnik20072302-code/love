<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="theme-color" content="#f2f0e9">
  <title>Вход — Наше потом</title>
  <link rel="stylesheet" href="/login.css">
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="login-card">
    <span class="login-mark">н·н</span>
    <p class="login-eyebrow">ВАША ОБЩАЯ ИСТОРИЯ</p>
    <h1>Наше потом</h1>
    <p class="login-copy">Введите общий пароль, чтобы открыть карту желаний.</p>
    <form id="login-form">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" autocomplete="current-password" maxlength="512" required autofocus>
      <p class="login-error" id="login-error" role="alert" aria-live="polite"></p>
      <button type="submit">Войти <span>↗</span></button>
    </form>
  </main>
</body>
</html>
