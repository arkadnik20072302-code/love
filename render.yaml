services:
  - type: web
    name: nashe-potom
    runtime: python
    plan: 0.5c-512mb
    buildCommand: "pip install -r requirements-web.txt"
    startCommand: "python app.py"
    healthCheckPath: /health
    envVars:
      - key: SUPABASE_URL
        value: https://yvdehidjlmtsdtrdfkxv.supabase.co
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: APP_SESSION_SECRET
        generateValue: true
      - key: TELEGRAM_MODE
        value: cloud
